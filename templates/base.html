<!DOCTYPE html>

{% load i18n_tags static %}
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% t 'osonsayt_sayt_dlya_vashego_biz' 'osonSAYT — Сайт для вашего бизнеса за $200/год | Домен, хостинг и админ-панель включены' %}</title>
<meta content="Создайте сайт для вашего бизнеса за $200 в год. Домен, хостинг, SSL-сертификат и админ-панель включены. Готово за 3 дня." name="description"/>
<meta content="osonSAYT — Сайт для вашего бизнеса за $200/год" property="og:title"/>
<meta content="Домен, хостинг, SSL и админ-панель включены. Готово за 3 дня." property="og:description"/>
<meta content="website" property="og:type"/>


<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
{% block content %}{% endblock %}
<script>
    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('open');
    });
    // Close mobile menu on link click
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => mobileMenu.classList.remove('open'));
    });

    // FAQ accordion
    const faqItems = document.querySelectorAll('.faq-item');
    faqItems.forEach(item => {
      const trigger = item.querySelector('.faq-trigger');
      trigger.addEventListener('click', () => {
        const isOpen = item.classList.contains('open');
        faqItems.forEach(i => i.classList.remove('open'));
        if (!isOpen) item.classList.add('open');
      });
    });

    // Template gallery filter
    const filterBtns = document.querySelectorAll('.filter-btn');
    const templateCards = document.querySelectorAll('#templateGrid .template-card');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        templateCards.forEach(card => {
          if (filter === 'all' || card.dataset.category === filter) {
            card.style.display = '';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });

    // Scroll reveal animation
    const revealElements = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    revealElements.forEach(el => observer.observe(el));

    // Header shadow on scroll
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 10) {
        header.classList.add('shadow-md');
      } else {
        header.classList.remove('shadow-md');
      }
    });
  </script>
</body>
</html>
