<meta content="Домен, хостинг, SSL и админ-панель включены. Готово за 3 дня." property="og:description"/>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Scroll reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Template thumbnail browser mockup */
    .thumb-browser-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 6px 6px 0 0;
    }
    .thumb-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* FAQ accordion */
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }
    .faq-item.open .faq-answer {
      max-height: 500px;
      padding-top: 0;
      padding-bottom: 24px;
    }
    .faq-item.open .faq-chevron {
      transform: rotate(180deg);
    }
    .faq-chevron {
      transition: transform 0.3s ease;
    }

    /* Mobile menu */
    .mobile-menu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .mobile-menu.open {
      max-height: 400px;
    }

    /* Gallery filter active state */
    .filter-btn.active {
      background-color: #0D9488;
      color: #ffffff;
    }

    /* Template card hover */
    .template-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .template-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.1);
    }

    /* Comparison table highlight */
    .compare-highlight {
      box-shadow: 0 0 0 2px #0D9488;
    }
  </style>
<meta content="https://bolt.new/static/og_default.png" property="og:image"/>
<meta content="summary_large_image" name="twitter:card"/>
<meta content="https://bolt.new/static/og_default.png" name="twitter:image"/>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
{% block content %}{% endblock %}
<script>
    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('open');
    });
    // Close mobile menu on link click
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => mobileMenu.classList.remove('open'));
    });

    // FAQ accordion
    const faqItems = document.querySelectorAll('.faq-item');
    faqItems.forEach(item => {
      const trigger = item.querySelector('.faq-trigger');
      trigger.addEventListener('click', () => {
        const isOpen = item.classList.contains('open');
        faqItems.forEach(i => i.classList.remove('open'));
        if (!isOpen) item.classList.add('open');
      });
    });

    // Template gallery filter
    const filterBtns = document.querySelectorAll('.filter-btn');
    const templateCards = document.querySelectorAll('#templateGrid .template-card');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        templateCards.forEach(card => {
          if (filter === 'all' || card.dataset.category === filter) {
            card.style.display = '';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });

    // Scroll reveal animation
    const revealElements = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    revealElements.forEach(el => observer.observe(el));

    // Header shadow on scroll
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 10) {
        header.classList.add('shadow-md');
      } else {
        header.classList.remove('shadow-md');
      }
    });
  </script>
</body>
</html>
