{% load i18n_tags %}
<section class="bg-slate-900 text-white">
<div class="max-w-container mx-auto px-6 lg:px-8 py-6">
<div class="flex flex-col sm:flex-row items-center justify-between gap-4">
<div class="flex items-center gap-6">
<span class="text-xs font-medium text-slate-400 uppercase tracking-wider">{% t 'prinimaem_oplatu' 'Принимаем оплату' %}</span>
<div class="flex items-center gap-4">
<!-- Payment partner 1: Click -->
<div class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-lg border border-white/10">
<div class="w-7 h-7 bg-sky-400 rounded-lg flex items-center justify-center">
<svg class="w-4 h-4 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
</svg>
</div>
<span class="text-sm font-bold text-white">Click</span>
</div>
<!-- Payment partner 2: Payme -->
<div class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-lg border border-white/10">
<div class="w-7 h-7 bg-emerald-400 rounded-lg flex items-center justify-center">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-sm font-bold text-white">Payme</span>
</div>
</div>
</div>
<div class="flex items-center gap-3">
<div class="flex -space-x-2">
<div class="w-8 h-8 rounded-full bg-primary-400 border-2 border-slate-900"></div>
<div class="w-8 h-8 rounded-full bg-accent-400 border-2 border-slate-900"></div>
<div class="w-8 h-8 rounded-full bg-sky-400 border-2 border-slate-900"></div>
<div class="w-8 h-8 rounded-full bg-rose-400 border-2 border-slate-900"></div>
</div>
<span class="text-sm font-medium text-slate-300">{% t 'nam_doveryayut' 'Нам доверяют' %} <span class="font-bold text-white">120+</span> {% t 'biznesov' 'бизнесов' %}</span>
</div>
</div>
</div>
</section>
